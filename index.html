<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크롤링 연습용 - 프리미엄 테크 스토어</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 헤더 영역 -->
    <header class="main-header">
        <div class="container">
            <h1 class="logo">TECH<span>FLOW</span></h1>
            <nav class="category-nav">
                <ul>
                    <li><a href="#" class="active">모든 상품</a></li>
                    <li><a href="#">노트북</a></li>
                    <li><a href="#">스마트폰</a></li>
                    <li><a href="#">태블릿</a></li>
                </ul>
            </nav>
            <form id="search-form" class="search-group">
                <input type="search" name="keyword" placeholder="제품명을 검색하세요...">
                <button type="submit"><i class="fa fa-search"></i></button>
            </form>
        </div>
    </header>

    <main class="container main-layout">
        <!-- 필터 사이드바 -->
        <aside class="filter-sidebar">
            <div class="filter-card">
                <h3>브랜드</h3>
                <ul class="filter-list">
                    <li><label><input type="checkbox"> 삼성전자</label></li>
                    <li><label><input type="checkbox"> 애플</label></li>
                    <li><label><input type="checkbox"> LG전자</label></li>
                    <li><label><input type="checkbox"> ASUS</label></li>
                </ul>
            </div>
        </aside>

        <!-- 상품 리스트 영역 -->
        <section class="product-section">
            <div class="list-header">
                <p>총 <span id="total-count">48</span>개의 상품이 있습니다.</p>
                <select class="sort-dropdown">
                    <option>추천순</option>
                    <option>신상품순</option>
                    <option>가격 낮은순</option>
                </select>
            </div>

            <div class="product-container" id="product-list">
                <!-- 상품 아이템 1 -->
                <article class="item-card" data-id="p1">
                    <div class="item-thumb">
                        <img src="https://picsum.photos/id/20/400/300" alt="상품">
                        <div class="item-overlay">상세보기</div>
                    </div>
                    <div class="item-info">
                        <span class="category-tag">노트북</span>
                        <h3 class="item-name"><a href="javascript:void(0);">2026 맥북 프로 14 M4 Max 에디션</a></h3>
                        <div class="item-price">
                            <strong class="current">4,200,000원</strong>
                        </div>
                    </div>
                </article>

                <!-- 상품 아이템 2 -->
                <article class="item-card" data-id="p2">
                    <div class="item-thumb">
                        <img src="https://picsum.photos/id/160/400/300" alt="상품">
                        <span class="status-badge">신제품</span>
                    </div>
                    <div class="item-info">
                        <span class="category-tag">스마트폰</span>
                        <h3 class="item-name"><a href="javascript:void(0);">갤럭시 S26 울트라 블랙 티타늄</a></h3>
                        <div class="item-price">
                            <strong class="current">1,850,000원</strong>
                        </div>
                    </div>
                </article>
                <!-- 연습 시 이 구조를 복사해서 데이터를 늘려보세요 -->
            </div>

            <!-- 페이지네이션 (중앙 배치) -->
            <nav class="pagination-center">
                <ul class="pager" id="pagination">
                    <li><a href="javascript:void(0);" class="pager-link active" data-page="1">1</a></li>
                    <li><a href="javascript:void(0);" class="pager-link" data-page="2">2</a></li>
                    <li><a href="javascript:void(0);" class="pager-link" data-page="3">3</a></li>
                    <li><a href="javascript:void(0);" class="pager-link" data-page="4">4</a></li>
                    <li><a href="javascript:void(0);" class="pager-link" data-page="next"><i class="fa fa-angle-right"></i></a></li>
                </ul>
            </nav>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 TECHFLOW. Crawling Practice Site.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
